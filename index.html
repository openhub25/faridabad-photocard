
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ফরিদাবাদ ৭০ সালা ফটোকার্ড</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;text-align:center;padding:20px}
.container{max-width:600px;margin:auto;background:white;padding:20px;border-radius:12px}
h2{color:#333}
input,button{margin:12px;padding:12px;font-size:16px}
button{background:#167b50;color:white;border:0;border-radius:6px;cursor:pointer}
button:disabled{opacity:.5}
canvas{width:100%;height:auto;margin-top:15px;border:1px solid #ddd}
#status{margin:12px;color:#167b50}
</style>
</head>
<body>
<div class="container">
<h2>ফরিদাবাদ ৭০ সালা ফটোকার্ড</h2>
<p>নিজের ছবি নির্বাচন করুন</p>
<input type="file" id="photoInput" accept="image/*">
<canvas id="canvas"></canvas>
<br>
<button id="downloadBtn" disabled>ফটোকার্ড ডাউনলোড করুন</button>
<button id="uploadBtn" disabled>ছবি জমা দিন</button>
<p id="status"></p>
</div>

<script>
const SUPABASE_URL = "https://uzwrtvzeeapkeqfabcbv.supabase.co";
const SUPABASE_KEY = "sb_publishable_3UdMAkA88HTIfU7qv0p82Q_GTfL0lK2";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TEMPLATE_URL = "https://uzwrtvzeeapkeqfabcbv.supabase.co/storage/v1/object/public/photocard-templates/Faridabad%2070%20Sala%20Photocard.jpeg";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const photoInput = document.getElementById("photoInput");
const downloadBtn = document.getElementById("downloadBtn");
const uploadBtn = document.getElementById("uploadBtn");
const statusText = document.getElementById("status");

const template = new Image();
template.crossOrigin = "anonymous";
let selectedPhoto = null;
let ready = false;

template.onload = () => {
  canvas.width = template.naturalWidth;
  canvas.height = template.naturalHeight;
  ctx.drawImage(template, 0, 0);
  ready = true;
};
template.onerror = () => {
  statusText.textContent = "ফটোকার্ডের ডিজাইন লোড হয়নি।";
};
template.src = TEMPLATE_URL;

photoInput.addEventListener("change", () => {
  const file = photoInput.files[0];
  if (!file) return;

  selectedPhoto = file;
  const photo = new Image();
  photo.onload = () => {
    if (!ready) {
      statusText.textContent = "ডিজাইন লোড হচ্ছে, একটু অপেক্ষা করুন।";
      return;
    }

    ctx.drawImage(template, 0, 0);

    // ছবির জায়গা: প্রয়োজনে প্রিভিউ দেখে এই মাপ ঠিক করা হবে
    const x = Math.round(canvas.width * 0.193);
    const y = Math.round(canvas.height * 0.174);
    const w = Math.round(canvas.width * 0.614);
    const h = Math.round(canvas.height * 0.582);

    const scale = Math.max(w / photo.width, h / photo.height);
    const sw = w / scale;
    const sh = h / scale;
    const sx = (photo.width - sw) / 2;
    const sy = (photo.height - sh) / 2;

    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.drawImage(photo, sx, sy, sw, sh, x, y, w, h);
    ctx.restore();

    downloadBtn.disabled = false;
    uploadBtn.disabled = false;
    statusText.textContent = "প্রিভিউ তৈরি হয়েছে।";
    URL.revokeObjectURL(photo.src);
  };
  photo.src = URL.createObjectURL(file);
});

downloadBtn.addEventListener("click", () => {
  const link = document.createElement("a");
  link.download = "faridabad-photocard.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});

uploadBtn.addEventListener("click", async () => {
  if (!selectedPhoto) return;

  uploadBtn.disabled = true;
  statusText.textContent = "ছবি জমা হচ্ছে...";

  try {
    const fileName = crypto.randomUUID() + "." +
      (selectedPhoto.name.split(".").pop() || "jpg");

    const { data, error } = await supabaseClient.storage
      .from("photocard-uploads")
      .upload(fileName, selectedPhoto);

    if (error) throw error;

    const { error: dbError } = await supabaseClient
      .from("photo_uploads")
      .insert({ image_url: data.path });

    if (dbError) throw dbError;

    statusText.textContent = "ছবি সফলভাবে জমা হয়েছে!";
  } catch (error) {
    statusText.textContent = "সমস্যা হয়েছে: " + error.message;
    uploadBtn.disabled = false;
  }
});
</script>
</body>
</html>
